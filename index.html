<!DOCTYPE html>
<html lang="pt-BR" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema PDV - Livraria</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' } // Habilita o modo noturno por classe
    </script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 dark:text-white transition-colors duration-200 font-sans">

    <!-- TELA DE LOGIN -->
    <div id="login-screen" class="min-h-screen flex items-center justify-center">
        <div class="bg-white dark:bg-gray-800 p-8 rounded-lg shadow-md w-96 border dark:border-gray-700">
            <h2 class="text-2xl font-bold mb-6 text-center text-gray-800 dark:text-white">Acesso ao Sistema</h2>
            <input type="email" id="email" placeholder="E-mail" class="w-full mb-4 p-2 border rounded dark:bg-gray-700 dark:border-gray-600">
            <input type="password" id="senha" placeholder="Senha" class="w-full mb-4 p-2 border rounded dark:bg-gray-700 dark:border-gray-600">
            <button onclick="login()" class="w-full bg-blue-600 text-white p-2 rounded font-bold hover:bg-blue-700">Entrar</button>
            <p id="auth-msg" class="text-red-500 text-sm mt-3 text-center"></p>
        </div>
    </div>

    <!-- TELA PRINCIPAL DO APP -->
    <div id="app-screen" class="hidden min-h-screen flex flex-col">
        <!-- HEADER -->
        <header class="bg-blue-700 dark:bg-gray-800 text-white p-4 shadow-md flex justify-between items-center">
            <h1 class="text-xl font-bold" id="titulo-aba">Frente de Caixa</h1>
            <div class="flex gap-4 items-center">
                <span id="user-info" class="text-sm font-semibold bg-blue-800 dark:bg-gray-700 px-3 py-1 rounded"></span>
                <button onclick="toggleDarkMode()" class="text-xl" title="Alternar Modo Noturno">🌗</button>
                <button onclick="logout()" class="text-sm font-bold bg-red-500 px-3 py-1 rounded hover:bg-red-600">Sair</button>
            </div>
        </header>

        <!-- MENU INFERIOR (NAVEGAÇÃO) -->
        <nav class="bg-white dark:bg-gray-800 border-b dark:border-gray-700 p-2 flex justify-around shadow-sm overflow-x-auto">
            <button id="btn-vendas" onclick="mudarAba('vendas', 'Frente de Caixa')" class="nav-btn text-blue-600 dark:text-blue-400 font-bold p-2 min-w-[80px]">🛒 Vendas</button>
            <button id="btn-estoque" onclick="mudarAba('estoque', 'Consulta de Estoque')" class="nav-btn text-gray-400 p-2 min-w-[80px]">📦 Estoque</button>
            
            <!-- Abas exclusivas para MASTER -->
            <button id="btn-cadastrar" onclick="mudarAba('cadastrar', 'Cadastrar Livro')" class="nav-btn master-only text-gray-400 p-2 min-w-[80px]">➕ Cadastrar</button>
            <button id="btn-relatorios" onclick="mudarAba('relatorios', 'Relatórios Excel')" class="nav-btn master-only text-gray-400 p-2 min-w-[80px]">📊 Relatórios</button>
            <button id="btn-usuarios" onclick="mudarAba('usuarios', 'Gerenciar Usuários')" class="nav-btn master-only text-gray-400 p-2 min-w-[80px]">👥 Usuários</button>
        </nav>

        <!-- ÁREA DE CONTEÚDO -->
        <main class="flex-1 p-4 max-w-3xl mx-auto w-full">
            
            <!-- ABA: VENDAS (Acesso de Todos) -->
            <div id="tab-vendas" class="aba-conteudo">
                <button onclick="iniciarCamera('venda')" class="w-full bg-emerald-600 text-white p-3 rounded-lg font-bold flex justify-center items-center gap-2 mb-3">
                    📷 Escanear Item para a Cesta
                </button>
                <div id="reader-venda" class="w-full mb-3"></div>
                
                <div class="flex gap-2 mb-4">
                    <input type="text" id="venda-isbn" placeholder="Ou digite o ISBN e adicione" class="w-2/3 p-2 border rounded-lg text-sm dark:bg-gray-700 dark:border-gray-600">
                    <button onclick="adicionarAoCarrinhoPorIsbn()" class="w-1/3 bg-blue-600 text-white p-2 rounded-lg text-sm font-bold">Adicionar</button>
                </div>

                <div class="bg-gray-50 dark:bg-gray-800 border dark:border-gray-700 p-3 rounded-lg mb-4">
                    <h4 class="font-bold text-sm text-gray-700 dark:text-gray-300 mb-2">Itens na Cesta:</h4>
                    <div id="lista-carrinho" class="space-y-2 mb-3 max-h-40 overflow-y-auto"></div>
                    <div class="border-t dark:border-gray-600 pt-2 flex justify-between items-center">
                        <span class="font-bold text-sm">Total a Pagar:</span>
                        <span class="font-bold text-lg text-emerald-600 dark:text-emerald-400" id="carrinho-total">R$ 0,00</span>
                    </div>
                </div>

                <div class="bg-blue-50 dark:bg-gray-800 border border-blue-200 dark:border-gray-700 p-3 rounded-lg mb-4 space-y-2">
                    <h4 class="font-bold text-xs text-blue-800 dark:text-blue-300 uppercase tracking-wide">Cadastro de Newsletter (Opcional)</h4>
                    <input type="text" id="cli-nome" placeholder="Nome (Opcional)" class="w-full p-2 border rounded text-sm bg-white dark:bg-gray-700 dark:border-gray-600">
                    <input type="email" id="cli-email" placeholder="E-mail (Opcional)" class="w-full p-2 border rounded text-sm bg-white dark:bg-gray-700 dark:border-gray-600">
                </div>

                <button onclick="finalizarVenda()" class="w-full bg-emerald-700 text-white p-3 rounded-lg font-bold shadow-md">✅ Finalizar Venda na Maquininha</button>
            </div>

            <!-- ABA: ESTOQUE (Todos veem, só Master edita/exclui) -->
            <div id="tab-estoque" class="aba-conteudo hidden">
                <input type="text" id="filtro-estoque" onkeyup="filtrarEstoque()" placeholder="Buscar por título ou ISBN..." class="w-full p-3 mb-4 border rounded-lg shadow-sm dark:bg-gray-700 dark:border-gray-600">
                <div id="lista-estoque-geral" class="space-y-3"></div>
            </div>

            <!-- ABA: CADASTRAR (Master) -->
            <div id="tab-cadastrar" class="aba-conteudo hidden">
                <button onclick="iniciarCamera('cadastro')" class="w-full bg-blue-800 text-white p-3 rounded-lg font-bold mb-3">📷 Escanear ISBN para Cadastrar</button>
                <div id="reader-cadastro" class="w-full mb-3"></div>
                
                <div class="space-y-3 bg-white dark:bg-gray-800 p-4 rounded-lg shadow-sm border dark:border-gray-700">
                    <input type="text" id="cad-isbn" placeholder="ISBN" class="w-full p-2 border rounded dark:bg-gray-700 dark:border-gray-600">
                    <input type="text" id="cad-titulo" placeholder="Título do Livro" class="w-full p-2 border rounded dark:bg-gray-700 dark:border-gray-600">
                    <input type="number" id="cad-preco" placeholder="Preço (R$)" class="w-full p-2 border rounded dark:bg-gray-700 dark:border-gray-600">
                    <input type="number" id="cad-qtd" placeholder="Quantidade no Estoque" class="w-full p-2 border rounded dark:bg-gray-700 dark:border-gray-600">
                    <button onclick="salvarLivro()" class="w-full bg-green-600 text-white p-3 rounded-lg font-bold">Salvar Livro no Estoque</button>
                </div>
            </div>

            <!-- ABA: RELATÓRIOS (Master) -->
            <div id="tab-relatorios" class="aba-conteudo hidden">
                <div class="bg-yellow-100 dark:bg-yellow-900 p-4 rounded-lg border dark:border-yellow-700 mb-6 shadow-sm text-center">
                    <h4 class="font-bold text-yellow-800 dark:text-yellow-200 text-sm">Vendas de Hoje</h4>
                    <p class="text-4xl font-bold text-yellow-900 dark:text-yellow-100 mt-2" id="vendas-hoje">R$ 0,00</p>
                </div>

                <h3 class="font-bold text-lg mb-3">Exportar Vendas para Excel</h3>
                <div class="space-y-3">
                    <button onclick="exportarExcel('diario')" class="w-full bg-green-700 text-white p-3 rounded-lg font-bold">📊 Baixar Relatório Diário</button>
                    <button onclick="exportarExcel('semanal')" class="w-full bg-green-600 text-white p-3 rounded-lg font-bold">📊 Baixar Relatório Semanal</button>
                    <button onclick="exportarExcel('mensal')" class="w-full bg-green-500 text-white p-3 rounded-lg font-bold">📊 Baixar Relatório Mensal</button>
                </div>
            </div>
            <!-- Área Master no Relatório / Gerenciamento -->
<div class="master-only flex-col gap-3 mt-6 pt-6 border-t border-slate-200 dark:border-slate-700">
    <p class="font-bold text-sm text-slate-500 uppercase tracking-wider">Ações Administrativas (Master)</p>

    <div class="flex flex-wrap gap-3">
        <!-- Botão para apagar uma venda específica -->
        <button onclick="excluirVendaPorCodigo()" class="bg-amber-100 hover:bg-amber-200 text-amber-800 dark:bg-amber-900/40 dark:text-amber-300 px-4 py-2 rounded-xl text-sm font-semibold transition-colors flex items-center gap-2">
            🗑️ Apagar Venda Específica (#)
        </button>

        <!-- Botão para limpar vendas dos últimos 30 dias -->
        <button onclick="limparHistoricoVendas30Dias()" class="bg-rose-100 hover:bg-rose-200 text-rose-700 dark:bg-rose-900/40 dark:text-rose-300 px-4 py-2 rounded-xl text-sm font-semibold transition-colors flex items-center gap-2">
            ⚠️ Limpar Vendas dos Últimos 30 Dias
        </button>
    </div>
</div>

            <!-- ABA: USUÁRIOS (Master) -->
            <div id="tab-usuarios" class="aba-conteudo hidden">
                <div class="bg-white dark:bg-gray-800 p-4 rounded-lg border dark:border-gray-700 mb-4 shadow-sm">
                    <h3 class="font-bold text-lg mb-2">Criar Novo Usuário</h3>
                    <input type="email" id="novo-user-email" placeholder="E-mail" class="w-full mb-2 p-2 border rounded dark:bg-gray-700 dark:border-gray-600">
                    <input type="password" id="novo-user-senha" placeholder="Senha (Mín. 6 char)" class="w-full mb-2 p-2 border rounded dark:bg-gray-700 dark:border-gray-600">
                    <select id="novo-user-role" class="w-full mb-3 p-2 border rounded dark:bg-gray-700 dark:border-gray-600">
                        <option value="normal">Normal (Apenas Venda/Consulta)</option>
                        <option value="master">Master (Acesso Total)</option>
                    </select>
                    <button onclick="criarUsuario()" class="w-full bg-blue-600 text-white p-2 rounded-lg font-bold">Adicionar Usuário</button>
                </div>
                
                <h3 class="font-bold text-lg mb-2">Usuários Existentes</h3>
                <div id="lista-usuarios" class="space-y-2"></div>
            </div>
            
        </main>
    </div>

    <!-- MODAL DE EDIÇÃO -->
    <div id="modal-edicao" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
        <div class="bg-white dark:bg-gray-800 p-5 rounded-lg w-full max-w-sm border dark:border-gray-700">
            <h3 class="font-bold text-lg mb-3">Editar Livro</h3>
            <input type="hidden" id="edit-id">
            <input type="text" id="edit-titulo" class="w-full mb-2 p-2 border rounded dark:bg-gray-700 dark:border-gray-600">
            <div class="flex gap-2 mb-4">
                <input type="number" id="edit-preco" placeholder="Preço" class="w-1/2 p-2 border rounded dark:bg-gray-700 dark:border-gray-600">
                <input type="number" id="edit-qtd" placeholder="Qtd" class="w-1/2 p-2 border rounded dark:bg-gray-700 dark:border-gray-600">
            </div>
            <div class="flex justify-between">
                <button onclick="fecharModal()" class="bg-gray-500 text-white px-4 py-2 rounded">Cancelar</button>
                <button onclick="salvarEdicao()" class="bg-blue-600 text-white px-4 py-2 rounded font-bold">Salvar</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
