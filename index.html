<!DOCTYPE html>
<html lang="pt-BR" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema PDV - Livraria</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <!-- Adicionando uma fonte mais elegante (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Suaviza as transições de cor no modo noturno */
        * { transition: background-color 0.3s, border-color 0.3s; }
    </style>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 dark:text-white min-h-screen flex flex-col">

    <!-- TELA DE LOGIN -->
    <div id="login-screen" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-800 p-8 rounded-3xl shadow-xl w-full max-w-md border border-slate-100 dark:border-slate-700">
            <div class="text-center mb-8">
                <div class="bg-indigo-100 dark:bg-indigo-900/50 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
                    <span class="text-2xl">📚</span>
                </div>
                <h2 class="text-2xl font-bold text-slate-800 dark:text-white">Acesso ao Sistema</h2>
                <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Insira suas credenciais para continuar</p>
            </div>
            
            <input type="email" id="email" placeholder="E-mail" class="w-full mb-4 p-3 border border-slate-200 rounded-xl bg-slate-50 dark:bg-slate-900 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-shadow">
            <input type="password" id="senha" placeholder="Senha" class="w-full mb-6 p-3 border border-slate-200 rounded-xl bg-slate-50 dark:bg-slate-900 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-shadow">
            
            <button onclick="login()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white p-3 rounded-xl font-semibold shadow-md shadow-indigo-200 dark:shadow-none transition-all">Entrar no Sistema</button>
            <p id="auth-msg" class="text-rose-500 text-sm mt-4 text-center font-medium"></p>
        </div>
    </div>

    <!-- TELA PRINCIPAL DO APP -->
    <div id="app-screen" class="hidden flex-1 flex flex-col h-screen overflow-hidden">
        
        <!-- HEADER -->
        <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 px-6 py-4 flex justify-between items-center shadow-sm z-10">
            <h1 class="text-xl font-bold tracking-tight text-slate-800 dark:text-white" id="titulo-aba">Frente de Caixa</h1>
            <div class="flex gap-3 items-center">
                <span id="user-info" class="text-xs font-semibold bg-indigo-50 dark:bg-indigo-900/30 text-indigo-700 dark:text-indigo-300 px-3 py-1.5 rounded-lg border border-indigo-100 dark:border-indigo-800/50"></span>
                <button onclick="toggleDarkMode()" class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors text-lg" title="Alternar Modo Noturno">🌗</button>
                <button onclick="logout()" class="text-sm font-semibold bg-rose-50 dark:bg-rose-900/30 text-rose-600 dark:text-rose-400 px-4 py-1.5 rounded-lg hover:bg-rose-100 dark:hover:bg-rose-900/50 transition-colors">Sair</button>
            </div>
        </header>

        <!-- ÁREA DE CONTEÚDO (Com scroll) -->
        <main class="flex-1 overflow-y-auto p-4 md:p-6 w-full max-w-3xl mx-auto pb-24">
            
            <!-- ABA: VENDAS (Acesso de Todos) -->
            <div id="tab-vendas" class="aba-conteudo">
                <button onclick="iniciarCamera('venda')" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white p-4 rounded-2xl font-semibold flex justify-center items-center gap-2 mb-4 shadow-sm transition-all">
                    📷 Escanear Item para a Cesta
                </button>
                <div id="reader-venda" class="w-full mb-4 rounded-2xl overflow-hidden shadow-sm"></div>
                
                <div class="flex gap-2 mb-6">
                    <input type="text" id="venda-isbn" placeholder="Ou digite o ISBN" class="flex-1 p-3 border border-slate-200 rounded-xl bg-white dark:bg-slate-800 dark:border-slate-700 focus:ring-2 focus:ring-emerald-500 outline-none">
                    <button onclick="adicionarAoCarrinhoPorIsbn()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-xl font-semibold transition-colors">Adicionar</button>
                </div>

                <!-- Cesta de Compras -->
                <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 p-5 rounded-2xl mb-6 shadow-sm">
                    <h4 class="font-semibold text-slate-700 dark:text-slate-300 mb-3 flex items-center gap-2">🛒 Itens na Cesta</h4>
                    <div id="lista-carrinho" class="space-y-3 mb-4 max-h-60 overflow-y-auto pr-2"></div>
                    <div class="border-t border-slate-100 dark:border-slate-700 pt-4 flex justify-between items-center">
                        <span class="font-medium text-slate-500 dark:text-slate-400">Total a Pagar</span>
                        <span class="font-bold text-2xl text-emerald-600 dark:text-emerald-400" id="carrinho-total">R$ 0,00</span>
                    </div>
                </div>

                <!-- Cliente -->
                <div class="bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 p-5 rounded-2xl mb-6">
                    <h4 class="font-semibold text-sm text-slate-600 dark:text-slate-300 mb-3">Dados do Cliente (Opcional)</h4>
                    <div class="space-y-3">
                        <input type="text" id="cli-nome" placeholder="Nome completo" class="w-full p-3 border border-slate-200 rounded-xl bg-white dark:bg-slate-800 dark:border-slate-700 focus:ring-2 focus:ring-indigo-500 outline-none">
                        <input type="email" id="cli-email" placeholder="E-mail para recibo" class="w-full p-3 border border-slate-200 rounded-xl bg-white dark:bg-slate-800 dark:border-slate-700 focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                </div>

                <button onclick="finalizarVenda()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white p-4 rounded-2xl font-bold shadow-lg shadow-emerald-200 dark:shadow-none text-lg transition-all">✅ Finalizar Venda</button>
            </div>

            <!-- ABA: ESTOQUE (Todos veem) -->
            <div id="tab-estoque" class="aba-conteudo hidden">
                <div class="relative mb-6">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400">🔍</span>
                    <input type="text" id="filtro-estoque" onkeyup="filtrarEstoque()" placeholder="Buscar por título ou ISBN..." class="w-full p-4 pl-12 border border-slate-200 rounded-2xl shadow-sm bg-white dark:bg-slate-800 dark:border-slate-700 focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div id="lista-estoque-geral" class="space-y-4"></div>
            </div>

            <!-- ABA: RELATÓRIOS (Liberado para todos) -->
            <div id="tab-relatorios" class="aba-conteudo hidden">
                <div class="bg-gradient-to-br from-indigo-500 to-purple-600 p-6 rounded-3xl mb-8 shadow-lg text-center text-white">
                    <h4 class="font-medium text-indigo-100 text-sm tracking-wide uppercase">Vendas de Hoje</h4>
                    <p class="text-5xl font-bold mt-2" id="vendas-hoje">R$ 0,00</p>
                </div>

                <h3 class="font-bold text-lg text-slate-800 dark:text-white mb-4">Exportar Relatórios (Excel)</h3>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <button onclick="exportarExcel('diario')" class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:border-indigo-500 text-slate-700 dark:text-slate-200 p-4 rounded-2xl font-semibold flex flex-col items-center gap-2 transition-all shadow-sm">
                        <span class="text-2xl">📅</span> Diário
                    </button>
                    <button onclick="exportarExcel('semanal')" class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:border-indigo-500 text-slate-700 dark:text-slate-200 p-4 rounded-2xl font-semibold flex flex-col items-center gap-2 transition-all shadow-sm">
                        <span class="text-2xl">📆</span> Semanal
                    </button>
                    <button onclick="exportarExcel('mensal')" class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:border-indigo-500 text-slate-700 dark:text-slate-200 p-4 rounded-2xl font-semibold flex flex-col items-center gap-2 transition-all shadow-sm">
                        <span class="text-2xl">🗓️</span> Mensal
                    </button>
                </div>
            </div>

            <!-- ABA: CADASTRAR (Apenas Master) -->
            <div id="tab-cadastrar" class="aba-conteudo hidden master-only">
                <button onclick="iniciarCamera('cadastro')" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white p-4 rounded-2xl font-semibold mb-4 shadow-sm transition-colors">
                    📷 Escanear ISBN para Cadastrar
                </button>
                <div id="reader-cadastro" class="w-full mb-4 rounded-2xl overflow-hidden"></div>
                
                <div class="space-y-4 bg-white dark:bg-slate-800 p-6 rounded-3xl shadow-sm border border-slate-100 dark:border-slate-700">
                    <h3 class="font-bold text-slate-800 dark:text-white mb-2">Dados do Livro</h3>
                    <input type="text" id="cad-isbn" placeholder="ISBN (Código de Barras)" class="w-full p-3 border border-slate-200 rounded-xl bg-slate-50 dark:bg-slate-900 dark:border-slate-700 focus:ring-2 focus:ring-indigo-500 outline-none">
                    <input type="text" id="cad-titulo" placeholder="Título do Livro" class="w-full p-3 border border-slate-200 rounded-xl bg-slate-50 dark:bg-slate-900 dark:border-slate-700 focus:ring-2 focus:ring-indigo-500 outline-none">
                    <div class="flex gap-4">
                        <input type="number" id="cad-preco" placeholder="Preço (R$)" class="w-1/2 p-3 border border-slate-200 rounded-xl bg-slate-50 dark:bg-slate-900 dark:border-slate-700 focus:ring-2 focus:ring-indigo-500 outline-none">
                        <input type="number" id="cad-qtd" placeholder="Qtd Estoque" class="w-1/2 p-3 border border-slate-200 rounded-xl bg-slate-50 dark:bg-slate-900 dark:border-slate-700 focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <button onclick="salvarLivro()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white p-4 rounded-xl font-bold transition-colors mt-2">Salvar no Estoque</button>
                </div>
            </div>

            <!-- ABA: USUÁRIOS (Apenas Master) -->
            <div id="tab-usuarios" class="aba-conteudo hidden master-only">
                <div class="bg-white dark:bg-slate-800 p-6 rounded-3xl border border-slate-200 dark:border-slate-700 mb-6 shadow-sm">
                    <h3 class="font-bold text-lg mb-4 text-slate-800 dark:text-white">Criar Novo Usuário</h3>
                    <input type="email" id="novo-user-email" placeholder="E-mail" class="w-full mb-3 p-3 border border-slate-200 rounded-xl bg-slate-50 dark:bg-slate-900 dark:border-slate-700 focus:ring-2 focus:ring-indigo-500 outline-none">
                    <input type="password" id="novo-user-senha" placeholder="Senha (Mín. 6 char)" class="w-full mb-3 p-3 border border-slate-200 rounded-xl bg-slate-50 dark:bg-slate-900 dark:border-slate-700 focus:ring-2 focus:ring-indigo-500 outline-none">
                    <select id="novo-user-role" class="w-full mb-4 p-3 border border-slate-200 rounded-xl bg-slate-50 dark:bg-slate-900 dark:border-slate-700 focus:ring-2 focus:ring-indigo-500 outline-none">
                        <option value="normal">Normal (Venda, Estoque, Relatórios)</option>
                        <option value="master">Master (Acesso Total)</option>
                    </select>
                    <button onclick="criarUsuario()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white p-3 rounded-xl font-bold transition-colors">Adicionar Usuário</button>
                </div>
                
                <h3 class="font-bold text-lg mb-3 text-slate-800 dark:text-white">Equipe</h3>
                <div id="lista-usuarios" class="space-y-3"></div>
            </div>
            
        </main>

        <!-- MENU INFERIOR (NAVEGAÇÃO ELEGANTE) -->
        <nav class="bg-white/80 dark:bg-slate-800/80 backdrop-blur-md border-t border-slate-200 dark:border-slate-700 p-2 pb-safe flex justify-around fixed bottom-0 w-full z-20">
            <button id="btn-vendas" onclick="mudarAba('vendas', 'Frente de Caixa')" class="nav-btn flex-1 flex flex-col items-center p-2 rounded-xl text-slate-500 transition-colors">
                <span class="text-xl mb-1">🛒</span><span class="text-xs font-semibold">Vendas</span>
            </button>
            <button id="btn-estoque" onclick="mudarAba('estoque', 'Consulta de Estoque')" class="nav-btn flex-1 flex flex-col items-center p-2 rounded-xl text-slate-500 transition-colors">
                <span class="text-xl mb-1">📦</span><span class="text-xs font-semibold">Estoque</span>
            </button>
            <button id="btn-relatorios" onclick="mudarAba('relatorios', 'Relatórios & Exportações')" class="nav-btn flex-1 flex flex-col items-center p-2 rounded-xl text-slate-500 transition-colors">
                <span class="text-xl mb-1">📊</span><span class="text-xs font-semibold">Relatórios</span>
            </button>
            
            <button id="btn-cadastrar" onclick="mudarAba('cadastrar', 'Cadastrar Livro')" class="nav-btn master-only flex-1 flex flex-col items-center p-2 rounded-xl text-slate-500 transition-colors">
                <span class="text-xl mb-1">➕</span><span class="text-xs font-semibold">Cadastrar</span>
            </button>
            <button id="btn-usuarios" onclick="mudarAba('usuarios', 'Gestão de Equipe')" class="nav-btn master-only flex-1 flex flex-col items-center p-2 rounded-xl text-slate-500 transition-colors">
                <span class="text-xl mb-1">👥</span><span class="text-xs font-semibold">Equipe</span>
            </button>
        </nav>
    </div>

    <!-- MODAL DE EDIÇÃO -->
    <div id="modal-edicao" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50 transition-opacity">
        <div class="bg-white dark:bg-slate-800 p-6 rounded-3xl w-full max-w-sm border border-slate-100 dark:border-slate-700 shadow-2xl">
            <h3 class="font-bold text-xl mb-4 text-slate-800 dark:text-white">Editar Livro</h3>
            <input type="hidden" id="edit-id">
            <input type="text" id="edit-titulo" class="w-full mb-3 p-3 border border-slate-200 rounded-xl bg-slate-50 dark:bg-slate-900 dark:border-slate-700 focus:ring-2 focus:ring-indigo-500 outline-none">
            <div class="flex gap-3 mb-6">
                <input type="number" id="edit-preco" placeholder="Preço" class="w-1/2 p-3 border border-slate-200 rounded-xl bg-slate-50 dark:bg-slate-900 dark:border-slate-700 focus:ring-2 focus:ring-indigo-500 outline-none">
                <input type="number" id="edit-qtd" placeholder="Qtd" class="w-1/2 p-3 border border-slate-200 rounded-xl bg-slate-50 dark:bg-slate-900 dark:border-slate-700 focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>
            <div class="flex justify-end gap-3">
                <button onclick="fecharModal()" class="bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 px-5 py-2.5 rounded-xl font-semibold hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors">Cancelar</button>
                <button onclick="salvarEdicao()" class="bg-indigo-600 text-white px-6 py-2.5 rounded-xl font-bold hover:bg-indigo-700 transition-colors shadow-md">Salvar</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
